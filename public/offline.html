<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1565c0" />
    <title>PowerBICraft — offline</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        font: 15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
        background: #f3f5f9; color: #1f2733;
      }
      .card {
        max-width: 460px; background: #fff; border: 1px solid #e1e6ef; border-radius: 16px;
        padding: 32px; box-shadow: 0 18px 50px rgba(15, 40, 80, 0.08);
      }
      img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { font-size: 20px; margin: 18px 0 8px; }
      p { margin: 0 0 16px; color: #576274; }
      a, button {
        display: inline-block; border: 0; border-radius: 8px; padding: 9px 16px;
        background: #1565c0; color: #fff; font: inherit; font-weight: 600;
        text-decoration: none; cursor: pointer;
      }
      .hint { font-size: 13px; color: #6b7688; margin-top: 14px; }
      @media (prefers-color-scheme: dark) {
        body { background: #0e1724; color: #e8edf5; }
        .card { background: #151f2e; border-color: #263246; }
        p, .hint { color: #9aa8bd; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>The report you were editing is safe in this browser. Reconnect to load the latest app shell, sync cloud workspaces or use AI analysis.</p>
      <button onclick="location.reload()">Try again</button>
      <p class="hint">Guest editing, charts and the browser library keep working when the cached app loads.</p>
    </main>
  </body>
</html>
